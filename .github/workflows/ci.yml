name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Ακυρώνει προηγούμενα runs του ίδιου branch — δεν έχει νόημα να τρέχουν δύο
# pipelines για κώδικα που έχει ήδη αντικατασταθεί.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- ΣΤΑΔΙΟ 1
  lint:
    name: Στάδιο 1 · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Εγκατάσταση εργαλείων ελέγχου
        run: pip install ruff mypy

      - name: Έλεγχος στυλ και σφαλμάτων (ruff)
        working-directory: backend
        run: ruff check .

      - name: Έλεγχος μορφοποίησης
        working-directory: backend
        run: ruff format --check .

  # ---------------------------------------------------------------- ΣΤΑΔΙΟ 2
  test:
    name: Στάδιο 2 · Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Εγκατάσταση εξαρτήσεων
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Εκτέλεση unit tests με έλεγχο κάλυψης
        working-directory: backend
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            --junitxml=junit.xml

      - name: Δημοσίευση περίληψης αποτελεσμάτων
        if: always()
        working-directory: backend
        run: |
          echo "### Αποτελέσματα ελέγχων (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          total = int(suite.get("tests", 0))
          failures = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          print(f"- Σύνολο: **{total}**")
          print(f"- Επιτυχή: **{total - failures}**")
          print(f"- Αποτυχίες: **{failures}**")
          PY

      - name: Ανέβασμα αναφοράς κάλυψης ως artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------- ΣΤΑΔΙΟ 3
  build:
    name: Στάδιο 3 · Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Τα PR σταματούν στα στάδια 1-2. Μόνο ο κώδικας που μπήκε στο main
    # πακετάρεται — αυτή είναι η γραμμή μεταξύ Delivery και Deployment.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Σύνδεση στο GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Το όνομα ενός Docker image υπακούει σε αυστηρότερους κανόνες από το
      # όνομα ενός repository: κάθε τμήμα της διαδρομής πρέπει να ξεκινά με
      # πεζό γράμμα ή ψηφίο. Ένα repository με κεφαλαία ή με παύλα στην αρχή
      # παράγει άκυρο όνομα image και το push αποτυγχάνει. Το κανονικοποιούμε
      # εδώ αντί να βασιζόμαστε στο ότι το repository θα λέγεται πάντα «σωστά».
      - name: Κανονικοποίηση ονόματος image
        id: img
        run: |
          raw="${{ github.repository }}"
          owner="${raw%%/*}"
          repo="${raw##*/}"
          safe="$(printf '%s/%s' "$owner" "$repo" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#/[^a-z0-9]+#/#')"
          echo "name=$safe" >> "$GITHUB_OUTPUT"
          echo "Όνομα image: ghcr.io/$safe"

      - name: Υπολογισμός ετικετών image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build και push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Το smoke test τρέχει το image μέσω του digest που μόλις δημοσιεύτηκε,
      # όχι μέσω ετικέτας που ξαναφτιάχνουμε με το χέρι: έτσι είναι αδύνατο να
      # δοκιμάσουμε κατά λάθος διαφορετικό image από αυτό που χτίστηκε.
      - name: Smoke test του container
        env:
          IMAGE: ghcr.io/${{ steps.img.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then
              echo "Το container απαντά."
              exit 0
            fi
            sleep 2
          done
          echo "Το container δεν απάντησε στο /health"
          docker logs smoke
          exit 1

  # ---------------------------------------------------------------- ΣΤΑΔΙΟ 4
  deploy:
    name: Στάδιο 4 · Deploy στο Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Ενεργοποίηση deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Δεν έχει οριστεί το RENDER_DEPLOY_HOOK — το deploy παραλείπεται."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Το deployment ξεκίνησε."
